<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0a0a1a">
  <title>Get Geo Conquest | App Store and Google Play</title>
  <meta name="description" content="Download Geo Conquest, the most complete geography quiz game, free on the Apple App Store and Google Play. This link sends you to the right store for your phone.">
  <meta name="robots" content="noindex, follow">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://omrisherman.github.io/get/">
  <meta property="og:title" content="Get Geo Conquest — free on iOS and Android">
  <meta property="og:description" content="The most complete geography quiz game. One link for the App Store and Google Play.">
  <meta property="og:image" content="https://omrisherman.github.io/og-image.png">
  <meta name="twitter:card" content="summary_large_image">
  <style>
    :root { --bg:#0a0a1a; --panel:#1a1a2e; --line:#2a2a4e; --gold:#ffd700; --gold-deep:#daa520; --muted:#a3a3c2; --text:#f5f5fa; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:28px; text-align:center; color:var(--text);
      background: radial-gradient(circle at 50% -8%, #23233f 0, #131326 34%, var(--bg) 62%);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; line-height:1.6; }
    main { width:min(440px, 100%); }
    .icon { width:112px; height:112px; border-radius:26px; box-shadow:0 0 0 1px var(--line), 0 0 44px rgba(255,215,0,.22), 0 18px 40px rgba(0,0,0,.5); }
    h1 { margin:22px 0 6px; font-size:clamp(1.9rem,6vw,2.4rem); line-height:1.1; letter-spacing:-.04em; }
    h1 span { color:var(--gold); }
    p { margin:0 0 22px; color:var(--muted); }
    .status { min-height:1.6em; color:var(--gold); font-weight:700; }
    .buttons { display:grid; gap:12px; margin:8px 0 26px; }
    a.btn { display:flex; align-items:center; justify-content:center; min-height:54px; padding:13px 22px; border-radius:12px; font-weight:800; text-decoration:none; }
    a.btn:focus-visible { outline:3px solid var(--gold); outline-offset:3px; }
    .primary { color:#0a0a1a; background:linear-gradient(180deg,var(--gold),var(--gold-deep)); }
    .secondary { border:1px solid var(--line); background:var(--panel); color:var(--text); }
    .desktop { display:none; padding:22px; border:1px solid var(--line); border-radius:18px; background:linear-gradient(145deg,var(--panel),#14142a); }
    .desktop.show { display:block; }
    .desktop img { width:168px; height:168px; border-radius:14px; background:#fff; }
    .desktop p { margin:12px 0 0; font-size:.92rem; }
    .home { display:inline-block; margin-top:22px; color:var(--muted); font-size:.92rem; }
  </style>
</head>
<body>
  <main>
    <img class="icon" src="/img/app-icon.png" width="112" height="112" alt="Geo Conquest app icon">
    <h1>Get <span>Geo Conquest</span></h1>
    <p>The most complete geography quiz game. Free on iPhone and Android.</p>
    <div class="status" id="status" role="status" aria-live="polite"></div>
    <div class="buttons">
      <a class="btn primary" id="ios" href="https://apps.apple.com/app/id6775380741" rel="noopener">Download on the App Store</a>
      <a class="btn secondary" id="android" href="https://play.google.com/store/apps/details?id=com.geoconquest.app" rel="noopener">Get it on Google Play</a>
    </div>
    <div class="desktop" id="desktop">
      <img src="/get/qr.svg" width="168" height="168" alt="QR code for this page. Scan it with your phone to open the right store.">
      <p>On a computer? Scan this with your phone and it opens the right store automatically.</p>
    </div>
    <a class="home" href="/">About Geo Conquest</a>
  </main>
  <script>
    // Send phones straight to their store; leave both buttons (and a QR code) for everyone else.
    // Without JavaScript the two buttons above still work.
    (function () {
      var ua = navigator.userAgent || '';
      var isAndroid = /Android/i.test(ua);
      // iPadOS 13+ reports itself as a Mac, so also check for a touch screen.
      var isIOS = /iPhone|iPad|iPod/i.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      var status = document.getElementById('status');
      var target = isIOS ? document.getElementById('ios') : isAndroid ? document.getElementById('android') : null;
      if (!target) { document.getElementById('desktop').className += ' show'; return; }
      status.textContent = isIOS ? 'Taking you to the App Store…' : 'Taking you to Google Play…';
      // replace() keeps this page out of the back-button history, so Back doesn't bounce you forward again.
      window.location.replace(target.href);
    })();
  </script>
</body>
</html>
